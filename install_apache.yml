---

- hosts: all
  become: true
  tasks:

  - name: update repository index
    apt:
      update_cache: yes
  
  - name: install vim-nox
    apt:
      name: vim-nox

  - name: install tmux
    apt:
      name: tmux

  - name: install apache2 package
    apt:
      name: apache2
      state: latest

  - name: add php support for apache
    apt:
      name: libapache2-mod-php
      state: latest
